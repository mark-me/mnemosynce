<div class="mb-3">
  <label class="form-label small mb-1" for="cron-global">
    Cron expression
    <a href="https://crontab.guru" target="_blank" rel="noopener"
       class="ms-1 text-body-secondary small">
      <i class="bi bi-question-circle"></i> help
    </a>
  </label>
  <input type="text" class="form-control form-control-sm font-monospace"
         id="cron-global" name="cron"
         value="{{ global_cfg.cron if global_cfg else '0 4 * * *' }}"
         placeholder="0 4 * * *" autocomplete="off">
</div>
<div class="mb-2">
  <div class="small text-body-secondary mb-1">Quick presets</div>
  <div class="d-flex flex-wrap gap-1">
    {% for expr, label in [("0 4 * * *","Daily 04:00"),("0 22 * * *","Daily 22:00"),("0 3 * * 0","Weekly Sun 03:00"),("0 4 1 * *","Monthly 1st")] %}
    <button type="button" class="btn btn-outline-secondary btn-sm"
            onclick="this.closest('form').querySelector('[name=cron]').value='{{ expr }}'">{{ label }}</button>
    {% endfor %}
  </div>
</div>
<div class="form-check">
  <input class="form-check-input" type="checkbox" id="enabled-global" name="enabled"
         {% if global_cfg and global_cfg.enabled %}checked{% endif %}>
  <label class="form-check-label small" for="enabled-global">
    Enable automatic scheduling
  </label>
</div>
